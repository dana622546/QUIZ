<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 소비 성향 테스트: 내 지갑은 안전할까?</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #2b7a78; font-size: 18px; margin-bottom: 15px; }
        .question { font-size: 15px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; text-align: left; color: #333; }
        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #3aafa9;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s, transform 0.1s;
        }
        .options button:hover { background-color: #2b7a78; transform: translateY(-2px); }
        #result-screen { display: none; }
        .char-emoji { font-size: 60px; margin: 10px 0; }
        .character-title { font-size: 20px; font-weight: bold; color: #17252a; margin: 10px 0; }
        .character-desc { font-size: 13px; color: #555; line-height: 1.5; text-align: left; background: #f0f7f4; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .share-tip { font-size: 12px; color: #e84545; font-weight: bold; margin-bottom: 15px; }
        .restart-btn { background: #2b7a78; color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="quiz-screen">
        <h2 id="counter">문항 1 / 10</h2>
        <div class="question" id="question-text">질문이 여기에 표시됩니다.</div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="result-screen">
        <h2>🎉 나의 소비 성향 결과</h2>
        <div class="char-emoji" id="char-emoji">🛒</div>
        <div class="character-title" id="char-title"></div>
        <div class="character-desc" id="char-desc"></div>
        <div class="share-tip">💡 친구에게 이 결과 보여주고 놀리기 찬스!</div>
        <button class="restart-btn" onclick="location.reload()">테스트 다시 하기</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "1. 인스타 피드를 보는데 좋아하는 인플루언서가 '인생템 틴트 마감 임박' 공구를 열었다. 나의 첫 행동은?",
            options: [
                "① 선착순 마감이라니 손이 먼저 간다! 광클 결제",
                "② '협찬'이나 '광고' 글씨가 숨겨져 있는지 돋보기로 스캔한다.",
                "③ 또 광고네, 무시하고 내가 필요한 거나 검색한다."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "2. 어제 검색했던 무선 이어폰 광고가 유튜브 쇼츠마다 귀신같이 따라붙는다. 이때 나는?",
            options: [
                "① 알고리즘이 내 운명을 이끄는구나 하며 홀린 듯 장바구니에 담는다.",
                "② 장바구니에 넣어두고 하루 동안 진짜 필요한지 고민한다.",
                "③ 쿠키를 차단하거나 광고를 무시하며 지갑을 꽁꽁 닫는다."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "3. 쇼핑몰 앱에 [⚡ 3분 뒤 쿠폰 소멸! 품절 임박 99%] 빨간 타이머가 돌아간다. 나의 심경은?",
            options: [
                "① 현기증 난다! 지금 안 사면 평생 후회할 것 같아서 허겁지겁 누른다.",
                "② 나를 조급하게 만드는 '다크 패턴' 상술인 걸 알지만 은근히 조급해진다.",
                "③ 어림도 없지. 저런 눈속임 상업 설계에 절대 속지 않는다."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "4. 친구가 '너 요즘 유행하는 이 옷 안 사? 다 이거 입는데'라며 부추긴다.",
            options: [
                "① 유행에 뒤처지면 못 참지! 당장 친구랑 커플템으로 지른다.",
                "② 옷장에 비슷한 게 있는 것 같은데... 그래도 살짝 흔들린다.",
                "③ 옷장에 멀쩡한 옷이 세 벌이나 있어. 과대포장 없는 가치 소비가 힙한 거야."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "5. 별점 5점짜리 극찬 리뷰가 수백 개 달린 제품을 발견했다. 나의 생각은?",
            options: [
                "① 리뷰가 이렇게 많으면 조작일 리가 없어! 믿고 바로 결제한다.",
                "② 알바나 체험단 리뷰일 수도 있으니까 단점 후기를 꼼꼼히 찾아본다.",
                "③ 체험단 영혼 없는 리뷰는 거르고, 진짜 구매자들의 팩폭 후기만 본다."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "6. SNS에서 우연히 '0원 특가! 배송비만 내세요' 광고를 봤다. 이때 나는?",
            options: [
                "① 0원인데 당연히 개이득이지! 바로 결제창으로 직행한다.",
                "② 뭔가 숨겨진 정기 구독이나 조건이 있는지 상세리뷰를 샅샅이 읽어본다.",
                "③ 세상에 공짜는 없다는 걸 알기에 깔끔하게 무시한다."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "7. 물건을 사고 나서 나중에 보니 '자동 결제'나 '옵션 추가 비용'이 숨겨져 있었다. 나의 반응은?",
            options: [
                "① 아이고 내 정신머리... 귀찮아서 그냥 구독료가 빠져나가게 둔다.",
                "③ 당장 고객센터를 찾거나 구독을 해지하며 피눈물을 흘린다.",
                "5. 애초에 결제할 때 약관이나 숨겨진 체크박스를 절대 그냥 지나치지 않았다."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "8. 마트나 인터넷에서 물건을 살 때 '과대포장'이나 일회용품 포장이 심한 제품을 보면?",
            options: [
                "① 디자인이 이쁘고 포장이 화려해야 선물용으로도 딱이지!",
                "② 예쁘긴 한데 쓰레기가 너무 많이 나올 것 같아서 살짝 마음이 걸린다.",
                "③ 지구와 환경을 생각해서 과대포장된 제품은 불매하거나 리필용을 산다."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "9. 한 달 동안 내가 충동적으로 쓴 지출 내역을 돌아보았을 때 나의 평가는?",
            options: [
                "① 통장 잔고를 보니 '어? 내 돈 어디 갔지?' 하며 시트콤 찍는 중이다.",
                "② 꼭 필요한 것 반, 알고리즘에 홀린 충동구매 반이다 반성하자.",
                "③ 계획적인 가치 소비 덕분에 통장과 지갑이 아주 평온하다."
            ],
            scores: [1, 3, 5]
        },
        {
            q: "10. 오늘 이 캠페인 테스트를 끝낸 나의 다짐은?",
            options: [
                "① 앞으로도 알고리즘이 이끄는 짜릿한 소비의 노예로 살겠다!",
                "② 광고랑 실속을 좀 더 잘 구별하고 충동구매를 줄여보겠다.",
                "③ 미디어 광고와 다크 패턴에 절대 휘둘리지 않는 완벽한 스마트 소비러가 된다!"
            ],
            scores: [1, 3, 5]
        }
    ];

    let currentQuestion = 0;
    let totalScore = 0;

    function loadQuiz() {
        const q = quizData[currentQuestion];
        document.getElementById("counter").innerText = `문항 ${currentQuestion + 1} / ${quizData.length}`;
        document.getElementById("question-text").innerText = q.q;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(q.scores[index]);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(score) {
        totalScore += score;
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuiz();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        
        let emoji = "";
        let title = "";
        let desc = "";

        if (totalScore <= 18) {
            emoji = "💸";
            title = "[유형 1] 지갑이 텅장인 '충동구매 요정'";
            desc = "알고리즘과 인플루언서의 유혹에 순식간에 지갑이 털리는 타입! '마감 임박'이나 '0원 특가'만 보면 눈이 돌아가네요. 앞으로는 장바구니에 넣고 하루 동안 고민하는 '24시간 쿨타임'이 시급합니다!";
        } else if (totalScore <= 28) {
            emoji = "🤔";
            title = "[유형 2] 아슬아슬 귀 얇은 '팔랑귀형 스마트러'";
            desc = "광고인 줄 어렴풋이 알면서도 묘하게 혜택이나 유행에 마음이 흔들리는 타입! 다크 패턴이나 협찬 광고를 경계하려는 눈은 있지만, 가끔 지름신의 유혹에 무너질 때가 있군요. 조금만 더 비판적인 눈을 길러봐요!";
        } else if (totalScore <= 42) {
            emoji = "🛡️";
            title = "[유형 3] 광고 따윈 안 통한다 '철벽 방어 스마트 소비러'";
            desc = "인플루언서의 숨은 뒷광고도, 쇼핑몰의 조급증 유발 다크 패턴도 요리조리 피해 가는 고수! 광고와 실속을 냉정하게 구분할 줄 아는 멋진 미디어 리터러시 능력을 갖추고 있네요.";
        } else {
            emoji = "👑";
            title = "[유형 4] 지구와 통장을 지키는 '가치소비 마스터'";
            desc = "단순히 지갑만 지키는 게 아니라 과대포장과 환경까지 생각하는 완벽한 킹갓제너럴 가치소비러! 유행에 휩쓸리지 않고 내 주체적인 삶과 지구를 동시에 지키는 이 시대 진정한 힙스터입니다!";
        }

        document.getElementById("char-emoji").innerText = emoji;
        document.getElementById("char-title").innerText = title;
        document.getElementById("char-desc").innerText = desc;
    }

    loadQuiz();
</script>

</body>
</html>
